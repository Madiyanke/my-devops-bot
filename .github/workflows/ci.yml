name: CI

# Intégration continue : lint, tests et build.
# - Automatique sur les pull requests et les branches autres que main.
# - Sur main, elle est appelée par le workflow CD (workflow_call) avant tout déploiement.
on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============================================
  # Backend : NestJS (lint, tests unitaires, e2e)
  # ============================================
  backend:
    name: Backend - Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./devops-tutor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: devops-tutor/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:ci

      - name: Unit tests
        run: npm run test:ci

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

  # ============================================
  # Frontend : Vue + Vitest + build PWA
  # ============================================
  frontend:
    name: Frontend - Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend-tutor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-tutor/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:ci

      - name: Tests
        run: npm run test:ci

      - name: Build (PWA)
        run: npm run build

  # ============================================
  # Images Docker : construction + scan de vulnérabilités (sans publication)
  # ============================================
  docker:
    name: Docker - Build & Scan (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: ./devops-tutor
          - name: web
            context: ./frontend-tutor
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          push: false
          tags: devops-tutor-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # Image officielle épinglée ; rapport informatif qui ne bloque pas le pipeline.
      - name: Trivy scan (CRITICAL / HIGH)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.1 image --severity CRITICAL,HIGH --ignore-unfixed \
            --exit-code 0 --no-progress devops-tutor-${{ matrix.name }}:ci
