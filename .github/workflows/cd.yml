name: CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  # -----------------------------------------------------------
  # JOB 1 : Build & Push (S'exécute sur les serveurs GitHub)
  # -----------------------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: ./devops-tutor
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/devops-tutor-api:latest

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-tutor
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/devops-tutor-web:latest

  # -----------------------------------------------------------
  # JOB 2 : Deploy (S'exécute sur TON VPS via le Runner)
  # -----------------------------------------------------------
  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Récupération de la config (Checkout)
        uses: actions/checkout@v4

      - name: Déploiement sur le serveur
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # 1. ACTIVATION DU PROXY 
          export http_proxy=http://cache.univ-pau.fr:3128
          export https_proxy=http://cache.univ-pau.fr:3128

          echo "Démarrage du déploiement sur le VPS..."

          # 2. Préparation des fichiers
          # On remplace le docker-compose local par celui de prod
          cp docker-compose.prod.yml docker-compose.yml

          # 3. Génération du fichier .env pour les conteneurs
          # IMPORTANT: docker-compose.prod.yml a besoin de DOCKER_USERNAME
          echo "DOCKER_USERNAME=$DOCKER_USERNAME" > .env
          echo "OPENAI_API_KEY=$OPENAI_KEY" >> .env
          echo "HTTP_PROXY=http://cache.univ-pau.fr:3128" >> .env
          echo "HTTPS_PROXY=http://cache.univ-pau.fr:3128" >> .env

          # 4. Authentification Docker 
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

          # 5. Mise à jour des images
          docker compose pull

          # 6. Redémarrage propre (Recrée les conteneurs avec la nouvelle config)
          docker compose up -d --remove-orphans

          # 7. Nettoyage des images inutilisées pour économiser l'espace disque
          docker image prune -f
          
          echo "✅ Déploiement terminé avec succès !"