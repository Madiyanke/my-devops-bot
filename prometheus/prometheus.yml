global:
  scrape_interval: 15s

scrape_configs:
  # Job 1 : Prometheus se surveille lui-même
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Job 2 : Ton API NestJS (nécessite @willsoto/nestjs-prometheus installé)
  - job_name: 'nestjs-api'
    metrics_path: '/metrics'
    scrape_interval: 5s
    static_configs:
      - targets: ['api:3000']

  # Job 3 : Métriques du VPS (CPU, RAM) via Node Exporter
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']