services:
  # Service Backend : recherche + synthèse IA
  api:
    build:
      context: ./devops-tutor
      dockerfile: Dockerfile
    ports:
      - "3003:3000"
    environment:
      # IA côté serveur (facultatif : chaque utilisateur peut aussi brancher sa clé dans l'interface)
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - LLM_MODEL=${LLM_MODEL:-}
      # Moteurs de recherche optionnels (gratuits avec inscription)
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
      - SEARXNG_URL=${SEARXNG_URL:-}
      # Autorise Ollama / API compatibles OpenAI sur une URL personnalisée
      - ALLOW_CUSTOM_BASE_URL=${ALLOW_CUSTOM_BASE_URL:-true}
    networks:
      - app-network

  # Service Frontend
  web:
    build:
      context: ./frontend-tutor
      dockerfile: Dockerfile
    ports:
      - "8280:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
