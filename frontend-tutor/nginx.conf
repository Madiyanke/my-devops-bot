server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # En-têtes de sécurité
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Les métriques Prometheus restent internes (Prometheus les lit directement sur api:3000)
    location = /api/metrics {
        return 404;
    }

    # Reverse proxy vers le backend API (conteneur / service 'api')
    # Toutes les requêtes /api/* sont redirigées vers le backend
    location /api/ {
        # Retirer le préfixe /api avant de transférer
        rewrite ^/api/(.*) /$1 break;

        # Proxy vers le backend (résolution DNS interne Docker / Kubernetes)
        proxy_pass http://api:3000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming (Server-Sent Events) : chaque morceau de réponse part immédiatement
        proxy_buffering off;
        proxy_cache off;
        gzip off;

        # Recherche + génération peuvent prendre plusieurs minutes
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # PWA : le service worker et le manifeste doivent toujours être revalidés,
    # sinon les mises à jour de l'application ne parviennent jamais aux utilisateurs.
    location ~* ^/(sw\.js|workbox-[^/]+\.js|registerSW\.js)$ {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Fichiers versionnés par Vite : cache long
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Gère le rechargement de la page (évite les erreurs 404 sur les routes Vue)
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ /index.html;
    }
}
