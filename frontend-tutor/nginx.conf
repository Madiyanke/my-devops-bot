server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy vers le backend API (conteneur 'api')
    # Toutes les requêtes /api/* sont redirigées vers le backend
    location /api/ {
        # Retirer le préfixe /api avant de transférer
        rewrite ^/api/(.*) /$1 break;
        
        # Proxy vers le conteneur backend (résolution DNS interne Docker)
        proxy_pass http://api:3000;
        
        # Headers nécessaires pour le proxy
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Gère le rechargement de la page (évite les erreurs 404 sur les routes Vue)
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}