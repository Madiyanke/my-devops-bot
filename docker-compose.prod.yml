# =============================================================================
# DevOps Mentor — production (VPS)
# Variables fournies par le .env généré par GitHub Actions (voir .github/workflows/cd.yml)
# =============================================================================
name: devops-tutor

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # -----------------------------------------------------------------
  # APPLICATION
  # -----------------------------------------------------------------
  api:
    image: ${DOCKERHUB_USERNAME}/devops-tutor-api:${IMAGE_TAG:-latest}
    container_name: devops-tutor-api
    # Pas de port publié : l'API n'est joignable que via nginx (service web).
    environment:
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
      - ALLOW_CUSTOM_BASE_URL=false
    restart: unless-stopped
    mem_limit: 512m
    logging: *logging
    networks:
      - app-network

  web:
    image: ${DOCKERHUB_USERNAME}/devops-tutor-web:${IMAGE_TAG:-latest}
    container_name: devops-tutor-web
    ports:
      # Le reverse proxy HTTPS du VPS redirige le domaine vers ce port.
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8280}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    mem_limit: 128m
    logging: *logging
    networks:
      - app-network

  # -----------------------------------------------------------------
  # MONITORING
  # -----------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: monitoring-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    restart: unless-stopped
    logging: *logging
    networks:
      - app-network

  # Métriques du VPS lui-même (CPU, RAM, disque) via les montages de l'hôte
  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: monitoring-node-exporter
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    restart: unless-stopped
    logging: *logging
    networks:
      - app-network

  grafana:
    image: grafana/grafana:12.1.1
    container_name: monitoring-grafana
    ports:
      # Accessible uniquement depuis le VPS : ssh -L 3004:127.0.0.1:3004 user@vps
      - "127.0.0.1:3004:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    logging: *logging
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
